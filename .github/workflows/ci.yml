name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check facedetected tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install OpenCV / MediaPipe system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libgles2 libglib2.0-0 libsm6 libxext6 libx11-6
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit + integration tests
        env:
          FACEDETECTED_MODELS_DIR: ${{ runner.temp }}/facedetected-models
        run: pytest -m '' -v
      - name: Upload annotated outputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.python-version }}
          path: outputs/
          if-no-files-found: ignore
